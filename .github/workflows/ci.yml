name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal tools)" || { gofmt -l cmd internal tools; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          # The config schema check fetches golangci-lint.run and has failed
          # a run on its timeout; `make lint` keeps it locally.
          verify: false
      # -race needs cgo; the shipped binary does not.
      - run: CGO_ENABLED=1 go test -race ./...
      - name: cross-compile every release target with CGO_ENABLED=0
        run: make cross VERSION=${GITHUB_REF_NAME}
      - name: smoke test
        run: ./dist/linux_amd64/nanobird version

  # The same tests on each platform NanoBird ships for (SPEC §11.1): path
  # handling, shells and encodings differ between them.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
